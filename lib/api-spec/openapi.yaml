openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CaliCoach API - calisthenics motion capture coaching app
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: exercises
    description: Exercise definitions
  - name: sessions
    description: Workout sessions
  - name: reps
    description: Rep tracking within sessions
  - name: progress
    description: Progress and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /exercises:
    get:
      operationId: listExercises
      tags: [exercises]
      summary: List all exercises
      responses:
        "200":
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"

  /exercises/{id}:
    get:
      operationId: getExercise
      tags: [exercises]
      summary: Get a single exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exercise detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "404":
          description: Not found

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all workout sessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Start a new workout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a single session with reps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session detail with reps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithReps"
        "404":
          description: Not found
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update (complete) a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}/reps:
    get:
      operationId: listReps
      tags: [reps]
      summary: List reps for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rep"
    post:
      operationId: createRep
      tags: [reps]
      summary: Log a rep for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepBody"
      responses:
        "201":
          description: Created rep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rep"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [progress]
      summary: Get overall progress summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/by-exercise:
    get:
      operationId: getProgressByExercise
      tags: [progress]
      summary: Get progress grouped by exercise
      responses:
        "200":
          description: Progress by exercise
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseProgress"

  /progress/timeline:
    get:
      operationId: getProgressTimeline
      tags: [progress]
      summary: Form score timeline for charts
      parameters:
        - name: exerciseId
          in: query
          schema:
            type: integer
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Timeline data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelinePoint"

  /progress/recent-sessions:
    get:
      operationId: getRecentSessions
      tags: [progress]
      summary: Get recent sessions with summary data
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent sessions with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Exercise:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        muscleGroups:
          type: array
          items:
            type: string
        keyJoints:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        coachingCues:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - description
        - muscleGroups
        - keyJoints
        - difficulty
        - coachingCues

    Session:
      type: object
      properties:
        id:
          type: integer
        exerciseId:
          type: integer
        exerciseName:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        totalReps:
          type: integer
        avgFormScore:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - id
        - exerciseId
        - exerciseName
        - startedAt
        - completedAt
        - totalReps
        - avgFormScore
        - notes

    SessionWithReps:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            reps:
              type: array
              items:
                $ref: "#/components/schemas/Rep"
          required:
            - reps

    CreateSessionBody:
      type: object
      properties:
        exerciseId:
          type: integer
        notes:
          type: string
          nullable: true
      required:
        - exerciseId

    UpdateSessionBody:
      type: object
      properties:
        completedAt:
          type: string
          format: date-time
        totalReps:
          type: integer
        avgFormScore:
          type: number
        notes:
          type: string
          nullable: true

    Rep:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        repNumber:
          type: integer
        formScore:
          type: number
        durationMs:
          type: integer
          nullable: true
        feedbackGiven:
          type: string
          nullable: true
        loggedAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - repNumber
        - formScore
        - durationMs
        - feedbackGiven
        - loggedAt

    CreateRepBody:
      type: object
      properties:
        repNumber:
          type: integer
        formScore:
          type: number
        durationMs:
          type: integer
          nullable: true
        feedbackGiven:
          type: string
          nullable: true
      required:
        - repNumber
        - formScore

    ProgressSummary:
      type: object
      properties:
        totalSessions:
          type: integer
        totalReps:
          type: integer
        avgFormScore:
          type: number
          nullable: true
        bestFormScore:
          type: number
          nullable: true
        currentStreak:
          type: integer
        improvementPercent:
          type: number
          nullable: true
      required:
        - totalSessions
        - totalReps
        - avgFormScore
        - bestFormScore
        - currentStreak
        - improvementPercent

    ExerciseProgress:
      type: object
      properties:
        exerciseId:
          type: integer
        exerciseName:
          type: string
        totalSessions:
          type: integer
        totalReps:
          type: integer
        avgFormScore:
          type: number
          nullable: true
        bestFormScore:
          type: number
          nullable: true
        lastSessionAt:
          type: string
          format: date-time
          nullable: true
      required:
        - exerciseId
        - exerciseName
        - totalSessions
        - totalReps
        - avgFormScore
        - bestFormScore
        - lastSessionAt

    TimelinePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        avgFormScore:
          type: number
        totalReps:
          type: integer
        exerciseId:
          type: integer
          nullable: true
        exerciseName:
          type: string
          nullable: true
      required:
        - date
        - avgFormScore
        - totalReps
        - exerciseId
        - exerciseName

    SessionSummary:
      type: object
      properties:
        id:
          type: integer
        exerciseId:
          type: integer
        exerciseName:
          type: string
        startedAt:
          type: string
          format: date-time
        totalReps:
          type: integer
        avgFormScore:
          type: number
          nullable: true
        durationMinutes:
          type: number
          nullable: true
      required:
        - id
        - exerciseId
        - exerciseName
        - startedAt
        - totalReps
        - avgFormScore
        - durationMinutes
